name: Interactive Android Emulator
on: workflow_dispatch # Allows you to manually trigger it from the Actions tab

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          # Add the current runner user to the kvm group
          sudo gpasswd -a $USER kvm
          
          # Open permissions on the KVM hardware device file
          sudo chmod 0666 /dev/kvm
          
          # Reload system udev rules to ensure it takes effect immediately
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Android Emulator and Stream to Browser
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            # 1. Install and start the emulator web streamer
            npm install -g serve-avd
            serve-avd &
            sleep 5
            
            # 2. Download and extract the official Ngrok binary directly
            # This completely avoids apt repository version mismatch errors
            curl -sS https://equinox.io | tar -xzf -
            sudo mv ngrok /usr/local/bin/
            
            # 3. Authenticate with your GitHub Secret token
            ngrok config add-authtoken $NGROK_TOKEN
            
            # 4. Start your permanent ngrok tunnel over port 3200
            # REMEMBER: Change 'your-free-static-domain.ngrok.app' to your actual ngrok custom domain!
            ngrok http 3200 --url=your-free-static-domain.ngrok.app
