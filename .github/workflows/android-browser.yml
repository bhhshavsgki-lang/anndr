name: Interactive Android Emulator
on: workflow_dispatch # Allows you to manually trigger it from the Actions tab

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Android Emulator and Stream to Browser
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            npm install -g serve-avd
            serve-avd &
            sleep 5
            
            # Download and authenticate ngrok
            curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt-get update && sudo apt-get install ngrok
            ngrok config add-authtoken $NGROK_TOKEN
            
            # Start tunnel with your permanent free static domain
            ngrok http 3200 --url=your-free-static-domain.ngrok.app
