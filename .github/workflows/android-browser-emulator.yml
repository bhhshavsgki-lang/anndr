name: Android emulator browser session

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to keep the browser session alive
        required: true
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  emulator:
    # GitHub-hosted Linux runners support Android hardware acceleration.
    # If this repository requires a larger/custom runner, replace this with
    # the runner label configured by the organization.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DISPLAY: :99
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.minutes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify KVM is available
        shell: bash
        run: |
          test -e /dev/kvm || {
            echo 'ERROR: /dev/kvm is unavailable on this runner.'
            echo 'Use a GitHub Linux runner with Android virtualization or a self-hosted Linux runner with KVM.'
            exit 1
          }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install browser streaming dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify curl

          # Ubuntu installs novnc_proxy under /usr/share/novnc.
          NOVNC_PROXY="$(command -v novnc_proxy || true)"

          if [ -z "$NOVNC_PROXY" ] && [ -x /usr/share/novnc/utils/novnc_proxy ]; then
            NOVNC_PROXY=/usr/share/novnc/utils/novnc_proxy
          fi

          test -n "$NOVNC_PROXY"
          test -x "$NOVNC_PROXY"

          sudo ln -sf "$NOVNC_PROXY" /usr/local/bin/novnc_proxy


      - name: Start virtual X display
        shell: bash
        run: |
          Xvfb "$DISPLAY" -screen 0 1080x1920x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          echo "$!" >/tmp/xvfb.pid
          for i in {1..20}; do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display "$DISPLAY" >/dev/null

      - name: Boot emulator and open browser session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-snapshot -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/serve-emulator.sh
