name: Android emulator browser session

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to keep the browser session alive
        required: true
        default: 20
        type: number

permissions:
  contents: read

jobs:
  emulator:
    # GitHub-hosted Linux runners support Android hardware acceleration.
    # If this repository requires a larger/custom runner, replace this with
    # the runner label configured by the organization.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DISPLAY: :99
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.minutes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify KVM is available
        shell: bash
        run: |
          test -e /dev/kvm || {
            echo 'ERROR: /dev/kvm is unavailable on this runner.'
            echo 'Use a GitHub Linux runner with Android virtualization or a self-hosted Linux runner with KVM.'
            exit 1
          }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install browser streaming dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify x11-utils libpulse0 curl

      - name: Start virtual X display
        shell: bash
        run: |
          nohup Xvfb "$DISPLAY" -screen 0 1080x1920x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 </dev/null &
          echo "$!" >/tmp/xvfb.pid
          for i in {1..20}; do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display "$DISPLAY" >/dev/null

      - name: Boot Android emulator
        shell: bash
        run: bash .github/scripts/start-emulator.sh

      - name: Start browser session and print link
        shell: bash
        run: bash .github/scripts/serve-emulator.sh

      - name: Keep browser session alive
        shell: bash
        run: |
          if ! [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] || (( SESSION_MINUTES < 5 || SESSION_MINUTES > 30 )); then
            echo 'SESSION_MINUTES must be a whole number from 5 to 30.'
            exit 1
          fi
          echo "Keeping the browser session alive for ${SESSION_MINUTES} minute(s)."
          sleep "$((SESSION_MINUTES * 60))"

      - name: Stop emulator and browser services
        if: always()
        shell: bash
        run: |
          for pidfile in /tmp/cloudflared.pid /tmp/novnc.pid /tmp/x11vnc.pid /tmp/emulator.pid /tmp/xvfb.pid; do
            if [[ -s "$pidfile" ]]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done
          adb emu kill 2>/dev/null || true
